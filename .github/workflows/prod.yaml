name: prod

on:
  push:
    branches: [production]

jobs:
  resolve:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Find the main commit that production contains
        id: source
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            sha=$(git rev-parse HEAD)
          elif [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 3 ]; then
            sha=$(git rev-parse HEAD^2)
          else
            echo "::error::Merge main into production with 'Create a merge commit'."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not a commit on main."
            exit 1
          fi
          if ! git diff --quiet "$sha" HEAD; then
            echo "::error::production differs from main commit ${sha}. Change main first, then merge main into production."
            exit 1
          fi
          docker manifest inspect "ghcr.io/${GITHUB_REPOSITORY}:sha-${sha}" > /dev/null
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  release:
    needs: resolve
    uses: ./.github/workflows/release.yaml
    with:
      environment: prod
      sha: ${{ needs.resolve.outputs.sha }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
