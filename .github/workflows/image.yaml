name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: famashines/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
      - name: Open a release pull request in gitops
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          TAG: sha-${{ github.sha }}
        run: |
          short="${GITHUB_SHA::7}"
          branch="release/the-vps-admin-dashboard-${short}"
          sed -i "s|newTag: .*|newTag: ${TAG}|" kubernetes/the-vps-admin-dashboard/kustomization.yaml
          if git diff --quiet; then
            echo "gitops already uses ${TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(the-vps-admin-dashboard): release sha-${short}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(the-vps-admin-dashboard): release sha-${short}" \
            --body "Deploy \`ghcr.io/${GITHUB_REPOSITORY}:${TAG}\` from ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}. Merge to deploy."
